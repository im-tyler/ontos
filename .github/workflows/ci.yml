name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

      - name: Bit-identical replay against committed golden stream
        run: |
          cargo run -q --release --bin ontos -- --ticks 200 --seed 7 --demote 1 0 --demote 0 1 --promote 1 0 --out /tmp/mixed.stream
          cmp /tmp/mixed.stream core/tests/golden/mixed.stream
          OUT=$(cargo run -q --release --bin ontos -- --ticks 200 --seed 7 --demote 1 0 --demote 0 1 --promote 1 0)
          [ "$OUT" = "seed=7 ticks=200 population=4 hash=0e0e9764dad3ab42" ]
          cargo run -q --release --bin ontos -- --mode gravity --contacts --ticks 400 --seed 11 --bodies 32 --out /tmp/g_contact.stream --wav /tmp/g_contact.wav
          cmp /tmp/g_contact.stream core/tests/golden/g_contact.stream
          cmp /tmp/g_contact.wav core/tests/golden/g_contact.wav
          cargo run -q --release --bin ontos -- --mode gravity --ticks 240 --seed 17 --bodies 12 --collapse-at 20 0 0 --expand-at 90 0 0 --collapse-at 91 0 0 --expand-at 160 0 0 --collapse-at 40 1 1 --expand-at 120 1 1 --demote-at 60 0 1 --radial --out /tmp/g_radial.stream
          cmp /tmp/g_radial.stream core/tests/golden/g_radial.stream
          cargo run -q --release --bin ontos -- --mode gravity --ticks 240 --seed 17 --bodies 12 --collapse-at 20 0 0 --expand-at 90 0 0 --collapse-at 91 0 0 --expand-at 160 0 0 --collapse-at 40 1 1 --expand-at 120 1 1 --demote-at 60 0 1 --shells --out /tmp/g_shells.stream
          cmp /tmp/g_shells.stream core/tests/golden/g_shells.stream
          cargo run -q --release --bin ontos -- --mode gravity --ticks 200 --seed 23 --bodies 10 --demote-at 20 1 1 --collapse-at 35 1 1 --expand-at 100 1 1 --out /tmp/g_coarse_collapse.stream
          cmp /tmp/g_coarse_collapse.stream core/tests/golden/g_coarse_collapse.stream
          cargo run -q --release --bin ontos -- --mode gravity --contacts --walls --ticks 600 --seed 22 --bodies 24 --collapse-at 5 0 1 --expand-at 200 0 1 --collapse-at 260 0 1 --out /tmp/g_walls.stream --wav /tmp/g_walls.wav
          cmp /tmp/g_walls.stream core/tests/golden/g_walls.stream
          cmp /tmp/g_walls.wav core/tests/golden/g_walls.wav
          cargo run -q --release --bin ontos -- --mode gravity --contacts --restitution 0.5 --friction 0.25 --ticks 400 --seed 11 --bodies 32 --out /tmp/g_restitution.stream --wav /tmp/g_restitution.wav
          cmp /tmp/g_restitution.stream core/tests/golden/g_restitution.stream
          cmp /tmp/g_restitution.wav core/tests/golden/g_restitution.wav
          cargo run -q --release --bin ontos -- --mode gravity --contacts --walls --restitution 0.7 --friction 0.3 --ticks 800 --seed 3 --bodies 16 --test-ic wallshot --out /tmp/g_wallshot.stream --wav /tmp/g_wallshot.wav
          cmp /tmp/g_wallshot.stream core/tests/golden/g_wallshot.stream
          cmp /tmp/g_wallshot.wav core/tests/golden/g_wallshot.wav
          cargo run -q --release --bin ontos -- --mode gravity --contacts --restitution 0.5 --friction 0.25 --demote-at 1 1 1 --ticks 500 --seed 11 --bodies 8 --test-ic coarsehit --out /tmp/g_coarsehit.stream --wav /tmp/g_coarsehit.wav
          cmp /tmp/g_coarsehit.stream core/tests/golden/g_coarsehit.stream
          cmp /tmp/g_coarsehit.wav core/tests/golden/g_coarsehit.wav
          echo "bit-identical on ${{ matrix.os }}"

  cross-verify:
    runs-on: ubuntu-latest
    name: verify streams with simval oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: usestemframework/simval
          path: simval
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release
      - name: Generate streams and verify with the independent Python reference
        run: |
          set -e
          verify() {
            ./target/release/ontos --ticks "$1" --seed "$2" "${@:3}" --out /tmp/case.stream
            PYTHONPATH=simval/src python3 -m simval.ontos /tmp/case.stream "$2" --ticks "$1" ${@:3}
          }
          verify_ic() {
            ic="$1"; t="$2"; s="$3"; shift 3
            ./target/release/ontos --ticks "$t" --seed "$s" "$@" --test-ic "$ic" --out /tmp/case.stream
            PYTHONPATH=simval/src python3 -m simval.ontos /tmp/case.stream "$s" --test-ic "$ic" --ticks "$t" "$@"
          }
          verify 64 42
          verify 64 42 --demote 1 0
          verify 64 42 --demote 0 0 --promote 0 0
          verify 200 7 --demote 1 0 --demote 0 1 --promote 1 0
          verify 300 123456789 --promote 1 1 --demote 1 1 --promote 1 1
          verify 1 0
          verify 100 42 --mode gravity --bodies 8
          verify 120 42 --mode gravity --bodies 8 --demote-at 20 0 0 --promote-at 80 0 0
          verify 150 3 --mode gravity --bodies 10 --demote-at 10 0 1 --demote-at 40 0 1 --promote-at 100 0 1
          verify 120 7 --mode gravity --bodies 12 --demote-at 5 1 1
          verify 300 5 --mode gravity --bodies 10 --observer 777
          verify 200 11 --mode gravity --bodies 10 --collapse-at 30 1 1 --expand-at 120 1 1
          verify 300 13 --mode gravity --bodies 12 --observer 42 --collapse-at 40 0 0
          verify 240 17 --mode gravity --bodies 12 --collapse-at 20 0 0 --expand-at 90 0 0 --collapse-at 91 0 0 --expand-at 160 0 0 --collapse-at 40 1 1 --expand-at 120 1 1 --demote-at 60 0 1
          verify 160 19 --mode gravity --bodies 6 --collapse-at 15 1 1 --expand-at 60 1 1 --collapse-at 30 0 0 --expand-at 100 0 0
          verify 400 11 --mode gravity --bodies 32 --contacts
          verify 300 17 --mode gravity --bodies 32 --contacts
          verify 400 11 --mode gravity --bodies 32 --contacts --collapse-at 100 0 0 --expand-at 250 0 0
          verify 300 7 --mode gravity --bodies 24 --contacts --demote-at 50 1 1 --promote-at 150 1 1
          verify 240 17 --mode gravity --bodies 12 --collapse-at 20 0 0 --expand-at 90 0 0 --collapse-at 91 0 0 --expand-at 160 0 0 --collapse-at 40 1 1 --expand-at 120 1 1 --demote-at 60 0 1 --radial
          verify 240 17 --mode gravity --bodies 12 --collapse-at 20 0 0 --expand-at 90 0 0 --collapse-at 91 0 0 --expand-at 160 0 0 --collapse-at 40 1 1 --expand-at 120 1 1 --demote-at 60 0 1 --shells
          verify 200 11 --mode gravity --bodies 10 --collapse-at 30 1 1 --expand-at 120 1 1 --radial
          verify 150 3 --mode gravity --bodies 10 --demote-at 10 0 1 --collapse-at 30 0 1 --expand-at 100 0 1
          verify 200 23 --mode gravity --bodies 10 --demote-at 20 1 1 --collapse-at 35 1 1 --expand-at 100 1 1
          verify 150 3 --mode gravity --bodies 10 --demote-at 10 0 1 --collapse-at 30 0 1 --expand-at 100 0 1 --shells
          verify 600 22 --mode gravity --bodies 24 --contacts --walls --collapse-at 5 0 1 --expand-at 200 0 1 --collapse-at 260 0 1
          verify 400 11 --mode gravity --bodies 32 --contacts --restitution 0.5 --friction 0.25
          verify 300 13 --mode gravity --bodies 16 --contacts --walls --restitution 0.8 --friction 0.1
          verify_ic wallshot 800 3 --mode gravity --contacts --walls --restitution 0.7 --friction 0.3 --bodies 16
          verify_ic coarsehit 500 11 --mode gravity --contacts --restitution 0.5 --friction 0.25 --demote-at 1 1 1 --bodies 8
      - name: Cross-check modal audio with the Python reference (spec section 22)
        run: |
          set -e
          LINE=$(./target/release/ontos --mode gravity --contacts --ticks 400 --seed 11 --bodies 32 --out /tmp/contact.stream --wav /tmp/contact.wav)
          echo "$LINE"
          HASH=$(echo "$LINE" | grep -o 'audio=[0-9a-f]*' | cut -d= -f2)
          PYTHONPATH=simval/src python3 -m simval.ontos_audio /tmp/contact.stream --wav /tmp/ref.wav --expect "$HASH"
          cmp /tmp/contact.wav /tmp/ref.wav
          LINE=$(./target/release/ontos --mode gravity --contacts --walls --ticks 600 --seed 22 --bodies 24 --collapse-at 5 0 1 --expand-at 200 0 1 --collapse-at 260 0 1 --out /tmp/walls.stream --wav /tmp/walls.wav)
          echo "$LINE"
          HASH=$(echo "$LINE" | grep -o 'audio=[0-9a-f]*' | cut -d= -f2)
          PYTHONPATH=simval/src python3 -m simval.ontos_audio /tmp/walls.stream --wav /tmp/ref_walls.wav --expect "$HASH"
          cmp /tmp/walls.wav /tmp/ref_walls.wav
          LINE=$(./target/release/ontos --mode gravity --contacts --walls --restitution 0.7 --friction 0.3 --ticks 800 --seed 3 --bodies 16 --test-ic wallshot --out /tmp/wallshot.stream --wav /tmp/wallshot.wav)
          echo "$LINE"
          HASH=$(echo "$LINE" | grep -o 'audio=[0-9a-f]*' | cut -d= -f2)
          PYTHONPATH=simval/src python3 -m simval.ontos_audio /tmp/wallshot.stream --wav /tmp/ref_wallshot.wav --expect "$HASH"
          cmp /tmp/wallshot.wav /tmp/ref_wallshot.wav
